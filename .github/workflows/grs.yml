name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=MrigankKumawat&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: github-stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Clone public repositories
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p repos

          gh repo list MrigankKumawat \
            --limit 100 \
            --source \
            --visibility public \
            --json nameWithOwner \
            --jq '.[].nameWithOwner' > repositories.txt

          while IFS= read -r repo; do
            name="${repo#*/}"

            echo "Cloning $repo"

            gh repo clone "$repo" "repos/$name" -- --depth 1 || \
              echo "Failed to clone $repo"
          done < repositories.txt

      - name: Generate Top Languages
        env:
          REPOS_DIR: repos
        run: |
          python scripts/generate_languages.py

      - name: Update GitHub Streak
        run: |
          curl --fail --location \
            --retry 3 \
            --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=MrigankKumawat&theme=tokyonight&hide_border=true" \
            --output streak-new.svg

          mv streak-new.svg streak.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg top-langs.svg streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi
